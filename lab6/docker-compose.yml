services:
  web:
    build: .
    container_name: okean-elzy-survey
    restart: unless-stopped
    environment:
      ADMIN_USER: admin
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env}
    volumes:
      - ./runtime/survey:/var/www/html/survey
      - ./runtime/data:/var/www/html/data
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.http.routers.oe-survey-http.rule: "Host(`oe-survey.3.120.206.129.sslip.io`)"
      traefik.http.routers.oe-survey-http.entryPoints: "http"
      traefik.http.routers.oe-survey-http.service: "oe-survey-http"
      traefik.http.routers.oe-survey-https.rule: "Host(`oe-survey.3.120.206.129.sslip.io`)"
      traefik.http.routers.oe-survey-https.entryPoints: "https"
      traefik.http.routers.oe-survey-https.service: "oe-survey-http"
      traefik.http.routers.oe-survey-https.tls.certresolver: "letsencrypt"
      traefik.http.services.oe-survey-http.loadbalancer.server.port: "80"

networks:
  coolify:
    external: true
